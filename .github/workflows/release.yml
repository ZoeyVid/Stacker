name: release
on:
  push:
    branches:
      - develop
    paths:
      - .version
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: 8
          distribution: corretto
      - name: version
        id: version
        run: |
          sed -i "s|0.0.0|"$(cat .version)"-dev|g" pom.xml
          echo "version=$(cat .version)" >> $GITHUB_OUTPUT
      - name: maven
        run: mvn -B package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: target/Stacker.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          version-type: release
          modrinth-featured: true
          github-prerelease: false
          name: v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          github-tag: ${{ steps.version.outputs.version }}
          files: target/Stacker.jar
          java: |
            1.8
            11
            16
            17
            21
            25
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          game-versions: |
            >=1.11.2
          modrinth-id: Ffx1tA97
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 507466
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
