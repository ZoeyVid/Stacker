name: release
on:
  push:
    branches:
      - develop
    paths:
      - .version
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 8
          distribution: corretto
      - name: version
        id: version
        run: |
          sed -i "s|0.0.0|$(cat .version)|g" pom.xml
          echo "version=$(cat .version)" >> $GITHUB_OUTPUT
      - name: maven
        run: mvn -B package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: target/Stacker.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        if: ${{ github.repository_owner == 'ZoeyVid' && github.event_name != 'pull_request' }}
        with:
          version-type: release
          modrinth-featured: true
          github-prerelease: false
          name: v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          github-tag: ${{ steps.version.outputs.version }}
          files: target/Stacker.jar
          java: |
            1.8
            11
            16
            17
            21
            25
          loaders: |
            bukkit
            spigot
            paper
            purpur
            folia
          game-versions: |
            >=1.11.2
          modrinth-id: Ffx1tA97
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 507466
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
