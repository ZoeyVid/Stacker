# Stacker
# A Plugin to Stack Player on the top of another Player
# by ZoeyVid
# GitHub: https://github.com/ZoeyVid
# Mastodon: https://social.zoeyvid.de/@ZoeyVid
#
# Should the stackmode enabled default on join?
defaultOn: true
#
# Should a message be shown when a player a not stackable?
showMessage: true
#
# Should a message be sent to the player when stackmode or immune is activated or deactivated for them by someone else?
sendMessage: true
#
# Should the last state of player be saved until the next Server restart?
saveState: true
#
# Should a Player be on join default immune?
defaultImmune: false
#
# Should the stacked players be throwable?
throwable: true
#
# Should the thrown players get fall damage?
throwfalldamage: false
#
# Language (Available Languages: https://github.com/ZoeyVid/Stacker/tree/stable/languages)
languageFile: en
#
# Should the plugin automatically update the Language File? (This will delete your custom changes)
autoUpdateLanguage: true
#
# Should the plugin automatically download updates? The update is applied on the next server restart.
autoUpdate: false
