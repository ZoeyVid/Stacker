name: build
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          java-version: 8
          distribution: corretto
      - name: version
        run: sed -i "s|0.0.0|$(cat .version)-dev|g" pom.xml
      - name: maven
        run: mvn -B package
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: target/Stacker.jar
          archive: false
          if-no-files-found: error
          retention-days: 3
