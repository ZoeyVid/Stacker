name: Release
on:
  push:
    branches:
      - stable
    paths:
      - .version
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up JDK 8
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 8
          distribution: corretto
      - name: Read .version file
        id: version
        run: echo "version=$(cat .github/.version)" >> $GITHUB_OUTPUT
      - name: Build with Maven
        run: |
          sed -i "s|0.0.0|"$(cat .github/.version)"|g" pom.xml
          mvn -B package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: |
            target/Stacker.jar
      - uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        if: github.ref_name == 'stable'
        with:
          version-type: release
          modrinth-featured: true
          github-prerelease: false
          name: v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          github-tag: ${{ steps.version.outputs.version }}
          files: target/Stacker.jar
          java: |
            1.8
            11
            16
            17
            21
            25
          loaders: |
            spigot
            paper
            purpur
          game-versions: |
            >=1.13
          modrinth-id: Ffx1tA97
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 507466
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
