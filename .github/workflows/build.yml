name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Set up JDK 8
        uses: actions/setup-java@v5.4.0
        with:
          java-version: 8
          distribution: corretto
      - name: Read .version file
        id: version
        run: echo "version=$(cat .github/.version)-dev" >> $GITHUB_OUTPUT
      - name: Build with Maven
        run: |
          sed -i "s|0.0.0|"$(cat .github/.version)"-dev|g" pom.xml
          mvn -B package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: artifacts
          path: |
            target/Stacker.jar
